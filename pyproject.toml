[project]
name = "helpdesk"
version = "0.1.0"
description = "IT Helpdesk Agent — 5-day MVP (production-aware, fully runnable)"
requires-python = ">=3.11"
# 8 个直接依赖(guide §1 冻结)
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "openai>=1.30",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "rich>=13.7",
    "pytest>=8.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
