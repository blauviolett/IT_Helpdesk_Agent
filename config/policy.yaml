# policy.yaml — 策略 + 资源枚举唯一来源(guide §2 / v3.1 P1-4)
# D1:resources 枚举 + 队列 + 定级矩阵;D3:4 条 deny-by-default 规则;
# 队列字段 allowlist 按计划 D4 填入。

# resource 枚举唯一来源(v3.1 P1-4 原文钉死)。
# intake prompt 的枚举值域 = 此处键 + "other";"other" 不触发 E2。
resources:
  snowflake_prod:
    aliases: ["snowflake production", "snowflake prod", "snowflake 生产库"]
    decision: DENY_REQUIRE_HUMAN
    queue: data-platform-approvers
  grafana_dashboards:
    aliases: ["grafana", "grafana dashboards", "内部监控看板"]
    decision: ALLOW          # 已有 viewer 权限时由升级消息说明

# 3 个队列 + packet 字段 allowlist(D4;handoff.build_packet 按队列过滤,
# 不在 allowlist 的字段一律不出现在工单正文;transcript/messages 永不入包)。
# data-platform-approvers 是权限审批队列:不需要也不应看到设备信息(PII 最小化,
# test_safety 钉死)—— 连 evidence digest 也不带(profile digest 含设备型号,
# 审批只需要申请人身份 + 申请资源 + 两段叙述);security-ir 需要设备信息定位终端,
# 但不带用户自试步骤等噪音。
queues:
  it-helpdesk:
    packet_fields:
      [case_id, category, reason_code, priority, queue, verbatim,
       agent_diagnosis, needed_from_human, user_answers, tried_by_user,
       evidence, contradictions, requester, device_info]
  data-platform-approvers:
    packet_fields:
      [case_id, category, reason_code, priority, queue, verbatim,
       agent_diagnosis, needed_from_human, requested_resources, requester]
  security-ir:
    packet_fields:
      [case_id, category, reason_code, priority, queue, verbatim,
       agent_diagnosis, needed_from_human, requester, device_info, evidence]

# 定级:scope → impact 映射 + impact × urgency 9 格查表(v2.1 §1.5 E3)。
# 约束:TEAM × MEDIUM → P3(test_gates 钉死);个人(INDIVIDUAL)deadline 上限 P2,
# 即个人案例无论多急不产生 P1(代码里显式 clamp)。
priority:
  scope_to_impact:
    INDIVIDUAL: LOW
    TEAM: MEDIUM
    ORG: HIGH
  matrix:            # matrix[impact][urgency] -> priority
    HIGH:   { HIGH: P1, MEDIUM: P2, LOW: P3 }
    MEDIUM: { HIGH: P2, MEDIUM: P3, LOW: P4 }
    LOW:    { HIGH: P2, MEDIUM: P3, LOW: P4 }

# 4 条授权规则(v2.1 D4:规则数不是能力,deny-by-default 才是)。
# 未声明的 action 一律 DENY —— 兜底在 policy.check 代码里,不在本表。
# grant_access:* 两条的 decision/queue 必须与上方 resources 段一致
# (加载时 assert 校验,防同一事实两处漂移)。
rules:
  - rule_id: RULE-UNLOCK-SELF
    action: send_unlock_verification    # 唯一走完整三段协议的写动作(v2.1 C2)
    decision: ALLOW
    requires_confirm: true
  - rule_id: RULE-TICKET
    action: create_escalation_ticket    # 记账写工具,无需用户确认(v2.1 C3)
    decision: ALLOW
    requires_confirm: false
  - rule_id: RULE-ACCESS-SNOWFLAKE-PROD
    action: grant_access:snowflake_prod
    decision: DENY_REQUIRE_HUMAN        # E2 → data-platform-approvers(GC-04)
    queue: data-platform-approvers
  - rule_id: RULE-ACCESS-GRAFANA
    action: grant_access:grafana_dashboards
    decision: ALLOW
